<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Collector · Egress Proof Panel</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#0B1F3A;color:#E2E8F0}
 header{display:flex;gap:14px;align-items:center;padding:12px 18px;background:#0F2A4A;border-bottom:3px solid #0D9488}
 h1{font-size:18px;margin:0;color:#fff} .chip{padding:3px 10px;border-radius:12px;font-weight:700;font-size:12px;color:#fff}
 .ONLINE{background:#16A34A}.OFFLINE{background:#E11D48}.SENT{background:#16A34A}.QUEUED{background:#D97706}.BLOCKED{background:#E11D48}.REJECTED{background:#7C3AED}
 .meta{font-size:12px;color:#94A3B8} button{background:#E11D48;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
 #banner{display:none;background:#E11D48;color:#fff;padding:8px 18px;font-weight:700}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px;margin-top:10px;font-weight:800;font-size:12px;letter-spacing:.06em}
 .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 18px;cursor:pointer}
 .row.pin{outline:2px solid #F59E0B;border-radius:8px}
 .raw,.out{border-radius:8px;padding:8px 10px;font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
 .raw{background:#2A1220;border:1.5px solid #E11D48}.out{background:#0F2A1E;border:1.5px solid #16A34A}
 .sec{background:#E11D48;color:#fff;padding:0 2px;border-radius:3px;font-weight:800}
 .h{font-size:10.5px;color:#94A3B8;margin-top:4px}
</style></head><body>
<header><h1>Collector · Egress Proof Panel <span class="meta">(local only · raw data is visible here and nowhere else)</span></h1>
 <span id="mode" class="chip">…</span><span id="meta" class="meta"></span>
 <span style="flex:1"></span><button onclick="chaos()">Simulate network cut (30 s)</button></header>
<div id="banner"></div>
<div class="cols"><div style="color:#FB7185">RAW (Tier 1 only)</div><div style="color:#4ADE80">OUTBOUND (exactly what crossed the wire)</div></div>
<div id="rows"></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pinned=null;
function hl(text,secs){let t=esc(text);for(const s of secs){const e=esc(JSON.stringify(s).slice(1,-1));t=t.split(e).join('<span class="sec">'+e+'</span>')}return t}
async function chaos(){await fetch('/api/chaos/outage?seconds=30',{method:'POST',headers:{'X-Chaos':'1'}})}
async function tick(){
 try{
  const st=await (await fetch('/api/status')).json();
  const m=document.getElementById('mode');m.textContent=st.mode;m.className='chip '+st.mode;
  document.getElementById('meta').textContent=`${st.tenant_id} · region ${st.region} · queue ${st.queue_depth} · sent ${st.sent} · blocked ${st.blocked} · v${st.version}`;
  const b=document.getElementById('banner');
  if(st.mode==='OFFLINE'){b.style.display='block';b.textContent=`OFFLINE: buffering ${st.queue_depth} payloads locally (${st.last_error||''})`}else b.style.display='none';
  const rows=await (await fetch('/api/egress-log?limit=20')).json();
  document.getElementById('rows').innerHTML=rows.map(r=>{
   const raw=r.raw?hl(JSON.stringify(r.raw,null,1),r.secrets_in_raw):'(raw line purged)';
   return `<div class="row ${pinned===r.payload_id?'pin':''}" onclick="pinned='${r.payload_id}'">
    <div><div class="raw">${raw}</div></div>
    <div><div class="out">${esc(JSON.stringify(r.outbound,null,1))}</div>
    <div class="h"><span class="chip ${r.status}">${r.status}</span> ${esc(r.payload_id)} · sha256 ${r.sha256.slice(0,16)}… · ${esc(r.created_at)}${r.matched_pattern?' · matched: '+esc(r.matched_pattern):''}</div></div></div>`}).join('');
 }catch(e){document.getElementById('mode').textContent='UI cannot reach collector'}
}
tick();setInterval(tick,2000);
</script></body></html>
