# Remediation policy: what the platform may propose, what needs a human, what is refused. Reviewed like code.
# Safe by default: autonomy "assisted" = every action needs an admin's approval; nothing is ever applied to a real system
# (the only actuator is the simulator). A tenant admin can lower autonomy at any time (kill switch) via PUT /api/remediation/config.
defaults:
  autonomy: assisted            # off (refuse all) | suggest (advice only) | assisted (human approves every action) | auto_low (low-risk, reversible, high-confidence run alone)
  auto_propose: true            # the platform drafts a proposal when an incident opens (a draft is not an action)
  approval_ttl_s: 900           # a pending proposal expires: a stale approval must not fire on changed conditions
  verify_after_s: 45            # after executing, wait this long, then compare health before/after
  auto_rollback_on_worse: true  # reversible action that made things worse is rolled back by the system (audited)
  separation_of_duties: true    # whoever proposed an action cannot be the one to approve it
  max_actions_per_node_per_hour: 3
  cooldown_s: 120               # same node + same action: not again within this time
  max_blast_auto: 0             # an action touching more dependent nodes than this is never auto-run
  max_blast_any: 2              # more than this => two approvals
  min_auto_confidence: 0.75
  protected_labels: ["db-*"]    # logical labels that never auto-run, whatever the risk
  change_freeze: false          # true = refuse everything (release freeze, incident bridge)
  risk_approvals: {low: 1, medium: 1, high: 2}
tenants: {}                     # per-tenant overrides, same keys, e.g.  tenant-beta: {autonomy: suggest}
