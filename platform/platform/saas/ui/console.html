 $("nav").replaceChildren(...items.map(([k,i,t,c])=>h("a",{class:ROUTE==k?"on":"",href:"#/"+k,"aria-current":ROUTE==k?"page":null},h("span",{"aria-hidden":"true"},i),t,c?h("span",{class:"n"},c):null)));

/* ---------- live stream ---------- */
function connect(){ES&&ES.close();ES=new EventSource("/api/stream?token="+encodeURIComponent(T));let deb=0;
