<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Status</title><style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#667085;--bd:#e4e7ec;--ok:#12a150;--warn:#d98a00;--bad:#d92d20}
@media(prefers-color-scheme:dark){:root{--bg:#0c0f13;--card:#151a21;--tx:#e8ecf1;--mu:#8b95a5;--bd:#232b36;--ok:#2fd27a;--warn:#f0a62a;--bad:#ff6a5c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}h1{font-size:22px;margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.banner{border-radius:14px;padding:18px 20px;margin:18px 0;color:#fff;font-weight:600;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 18px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px}.pill{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
h2{font-size:12px;letter-spacing:.08em;color:var(--mu);margin:22px 0 0;text-transform:uppercase}.err{text-align:center;padding:60px 0}
footer{margin-top:30px;font-size:12px;color:var(--mu)}
</style></head><body><main id="m" aria-live="polite"><div class="mu">Loading…</div></main><script>
const tok=location.pathname.split("/")[2]||"",m=document.getElementById("m");
const C={EXCELLENT:"var(--ok)",GOOD:"var(--ok)",FAIR:"var(--warn)",POOR:"var(--bad)"};
const L={EXCELLENT:"Operational",GOOD:"Operational",FAIR:"Degraded performance",POOR:"Service disruption"};
const el=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{})x=="class"?e.className=a[x]:x=="style"?e.style.cssText=a[x]:e.setAttribute(x,a[x]);for(const c of k.flat())e.append(c&&c.nodeType?c:document.createTextNode(c??""));return e};
const ago=s=>{s=Math.max(0,s);return s<90?Math.round(s)+"s":s<5400?Math.round(s/60)+" min":s<172800?(s/3600).toFixed(1)+" h":Math.round(s/86400)+" d"};
const when=t=>t?new Date(t*1000).toLocaleString():"";
function status(d){document.title=(L[d.overall]||"Status")+(d.label?" · "+d.label:"");
 const b=el("div",{class:"banner",style:"background:"+(C[d.overall]||"var(--mu)")},L[d.overall]||d.overall);
 const nodes=el("div",{class:"card"},d.nodes.map(n=>el("div",{class:"row"},el("span",{},el("i",{class:"dot",style:"background:"+(n.stale?"var(--mu)":C[n.state]||"var(--mu)")}),n.name),el("span",{class:"pill"},n.stale?"no recent data":(L[n.state]||n.state).toLowerCase()+" · "+ago(n.since_s)))));
 const inc=d.incidents.length?el("div",{class:"card"},d.incidents.map(i=>el("div",{class:"row"},el("span",{},el("b",{},i.title),el("div",{class:"mu"},i.ref+" · "+i.severity+" · started "+ago(Date.now()/1000-i.started_ts)+" ago")),el("span",{class:"pill"},"investigating")))):el("div",{class:"card"},el("div",{class:"row mu"},"No open incidents."));
 m.replaceChildren(el("h1",{},d.label||"Service status"),el("div",{class:"mu"},"Updated "+new Date(d.generated_ts*1000).toLocaleTimeString()+" · refreshes automatically"),b,el("h2",{},"Components"),nodes,el("h2",{},"Incidents"),inc,el("footer",{},"Read-only view. Link expires "+when(d.expires_ts)+"."))}
function incident(d){const i=d.incident;if(!i){m.replaceChildren(el("div",{class:"err"},d.error));return}
 document.title=i.ref+" · "+i.title;
 const open=i.status=="open";
 m.replaceChildren(el("h1",{},i.ref+" · "+i.title),el("div",{class:"mu"},i.kind+" · "+i.severity+" · started "+when(i.started_ts)),
  el("div",{class:"banner",style:"background:"+(open?"var(--warn)":"var(--ok)")},open?"Open · "+ago(i.duration_s)+" so far":"Resolved · lasted "+ago(i.duration_s)),
  el("h2",{},"What happened"),el("div",{class:"card"},el("p",{},i.summary),el("p",{class:"mu"},i.explanation)),
  el("h2",{},"Root cause"),el("div",{class:"card"},el("div",{class:"row"},el("span",{},i.root_cause),el("span",{class:"pill"},Math.round(i.confidence*100)+"% confidence")),el("div",{class:"row mu"},"Affected: "+i.affected.join(", "))),
  i.actions.length?[el("h2",{},"Actions taken"),el("div",{class:"card"},i.actions.map(a=>el("div",{class:"row"},el("span",{},a.action.replace(/_/g," ")+" on "+a.node),el("span",{class:"pill"},a.status+(a.verdict?" · "+a.verdict:"")))))]:"",
  i.timeline.length?[el("h2",{},"Timeline"),el("div",{class:"card"},i.timeline.map(e=>el("div",{class:"row"},el("span",{},e.kind.replace(/^remediation_/,"fix ").replace(/_/g," ")),el("span",{class:"mu"},when(e.ts)))))]:"",
  el("footer",{},"Read-only snapshot. Link expires "+when(d.expires_ts)+"."))}
async function load(){try{const r=await fetch("/s/"+encodeURIComponent(tok)+"/data",{cache:"no-store"});const d=await r.json();
 if(!r.ok){m.replaceChildren(el("div",{class:"err"},el("h1",{},"Link unavailable"),el("p",{class:"mu"},d.error||"Not found.")));return false}
 d.kind=="status"?status(d):incident(d);return d.kind=="status"||d.incident&&d.incident.status=="open"}catch(e){m.replaceChildren(el("div",{class:"err mu"},"Could not reach the service. Retrying…"));return true}}
(async function loop(){if(await load())setTimeout(loop,15000)})();
</script></body></html>
